@if (totalPaginas() > 1) {
  <nav class="paginacion" aria-label="Paginación">
    <button type="button" class="btn secundario" [disabled]="pagina() === 0" (click)="cambio.emit(pagina() - 1)">Anterior</button>
    @for (n of numeros(); track n) {
      <button
        type="button"
        class="numero"
        [class.actual]="n === pagina()"
        [attr.aria-current]="n === pagina() ? 'page' : null"
        (click)="cambio.emit(n)"
      >
        {{ n + 1 }}
      </button>
    }
    <button type="button" class="btn secundario" [disabled]="pagina() >= totalPaginas() - 1" (click)="cambio.emit(pagina() + 1)">Siguiente</button>
  </nav>
}
