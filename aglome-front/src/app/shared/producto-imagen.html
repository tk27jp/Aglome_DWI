@if (src(); as url) {
  <img class="foto" [src]="url" [alt]="producto().nombre" loading="lazy" (error)="fallo.set(url)" />
} @else {
  <div class="arte" [class]="'arte ' + tipo()" [style.--tono]="color()" role="img" [attr.aria-label]="'Vista de ' + producto().nombre">
    @switch (tipo()) {
      @case ('tornillo') {
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M34 30h52M60 30v10M52 44l16 6M52 56l16 6M52 68l16 6M52 80l16 6M60 92l0 8" />
            <rect x="34" y="22" width="52" height="10" rx="2" fill="currentColor" fill-opacity=".18" />
          </g>
        </svg>
      }
      @case ('bisagra') {
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round">
            <rect x="22" y="30" width="30" height="60" rx="3" fill="currentColor" fill-opacity=".16" />
            <rect x="68" y="30" width="30" height="60" rx="3" fill="currentColor" fill-opacity=".16" />
            <rect x="52" y="30" width="16" height="60" fill="currentColor" fill-opacity=".34" />
            <circle cx="37" cy="45" r="3.5" /><circle cx="37" cy="75" r="3.5" />
            <circle cx="83" cy="45" r="3.5" /><circle cx="83" cy="75" r="3.5" />
          </g>
        </svg>
      }
      @case ('envase') {
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
            <path d="M34 38h52v56a6 6 0 0 1-6 6H40a6 6 0 0 1-6-6z" fill="currentColor" fill-opacity=".16" />
            <path d="M30 38c0-6 6-10 14-10h32c8 0 14 4 14 10M34 56h52M34 76h52" />
          </g>
        </svg>
      }
      @case ('general') {
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round">
            <rect x="30" y="38" width="46" height="46" fill="currentColor" fill-opacity=".14" />
            <rect x="44" y="52" width="46" height="46" fill="currentColor" fill-opacity=".14" />
          </g>
        </svg>
      }
    }
  </div>
}
